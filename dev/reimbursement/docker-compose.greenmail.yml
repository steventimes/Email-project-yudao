services:
  greenmail:
    image: greenmail/standalone:2.1.11
    ports:
      - "3025:3025"
      - "3993:3993"
      - "8080:8080"
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=user-a:password-a@localhost,user-b:password-b@localhost
        -Dgreenmail.users.login=email
